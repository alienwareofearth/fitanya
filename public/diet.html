<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#FF5C00">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fitanya">
  <link rel="apple-touch-icon" href="/icons/icon.svg">
  <title>Meal Plan — Fitanya</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <style>
    .meal-card { background:var(--dark); border:1px solid var(--border); border-radius:var(--radius); padding:20px; margin-bottom:12px; }
    .meal-type { font-family:var(--font-display); font-size:1.1rem; color:var(--orange); margin-bottom:6px; }
    .water-glass { font-size:28px; cursor:pointer; transition:transform 0.15s; display:inline-block; }
    .water-glass.filled { filter:hue-rotate(0deg); }
    .water-glass.empty { opacity:0.3; }
    .water-glass:hover { transform:scale(1.2); }
  </style>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <a href="/dashboard" class="sidebar-logo"><img src="/icons/logo.png" alt="Fitanya"><span class="sidebar-logo-text">FIT<span>ANYA</span></span></a>
    <div id="sidebar-profile"></div>
    <nav class="sidebar-nav">
      <a href="/dashboard/schedule" class="nav-item"><span class="icon">📅</span>Sessions</a>
      <a href="/dashboard/membership" class="nav-item"><span class="icon">🎫</span>Membership</a>
      <a href="/dashboard/diet" class="nav-item active"><span class="icon">🥗</span>Meal Plan</a>
      <a href="/dashboard/monthly-games" class="nav-item"><span class="icon">🏆</span>Challenges</a>
      <a href="/dashboard/badges" class="nav-item"><span class="icon">🥇</span>Badges & Achievements</a>
      <a href="/dashboard/progress" class="nav-item"><span class="icon">📊</span>Progress</a>
      <a href="/dashboard/stories" class="nav-item"><span class="icon">⭐</span>Reviews</a>
      <a href="/dashboard/payment" class="nav-item"><span class="icon">💳</span>Pay Now</a>
      <a href="/dashboard/referral" class="nav-item"><span class="icon">🎁</span>Refer & Earn</a>
    </nav>
    <div class="sidebar-footer"><button class="nav-item" onclick="logout()"><span class="icon">🚪</span>Logout</button></div>
  </aside>
  <main class="main-content">
    <div class="page-header flex-between mb-32">
      <div>
        <h2>Meal Plan</h2>
        <p>Your personalised meal plan &nbsp;<span id="cache-age" class="text-dim text-small"></span></p>
      </div>
      <button class="btn btn-dark btn-sm" onclick="syncDiet()">🔄 Refresh</button>
    </div>

    <!-- Food Preference & Fitness Goal -->
    <div class="card mb-24" id="prefs-card" style="display:none">
      <div class="section-title">Your Preferences</div>
      <div class="grid-2 gap-16">
        <div class="form-group">
          <label>Food Preference</label>
          <select class="form-control" id="pref-food" onchange="savePrefs()">
            <option value="">Select</option>
            <option>Veg</option><option>Vegan</option><option>Non-Veg</option>
          </select>
        </div>
        <div class="form-group">
          <label>Fitness Goal</label>
          <select class="form-control" id="pref-goal" onchange="savePrefs()">
            <option value="">Select</option>
            <option>Get Lean</option><option>Build Muscle</option><option>Tone &amp; Sculpt</option><option>Improve Fitness</option>
          </select>
        </div>
      </div>
      <p class="text-dim text-small">Your coach uses these to customise your meal plan.</p>
    </div>

    <!-- Meal plan -->
    <div class="card mb-24">
      <div class="section-title">Today's Meal Plan</div>
      <div class="form-group">
        <label>Select Date</label>
        <input class="form-control" id="diet-date" readonly />
      </div>
      <div id="diet-plan-info" class="mb-16"></div>
      <div id="meals-wrap"><div class="spinner"></div></div>
    </div>
  </main>
</div>
<div id="toast-container"></div>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="/js/app.js"></script>
<script>
  let today = new Date().toISOString().split('T')[0];
  let _currentDate = today;
  let _savePrefsTimer = null;

  function dietCacheKey(date) { return 'diet_' + date; }

  function showAge(date) {
    const age = pageCache.ageLabel(dietCacheKey(date));
    const el = document.getElementById('cache-age');
    if (el) el.textContent = age ? '· cached ' + age : '';
  }

  function syncDiet() {
    pageCache.bust(dietCacheKey(_currentDate));
    loadDiet(_currentDate, true);
  }

  async function init() {
    const data = await requireAuth();
    if (!data) return;
    // Pre-fill preferences from profile
    const profile = data.profile || {};
    if (profile.food_preference || profile.fitness_goal) {
      document.getElementById('pref-food').value = profile.food_preference || '';
      document.getElementById('pref-goal').value = profile.fitness_goal || '';
    }
    document.getElementById('prefs-card').style.display = '';

    flatpickr('#diet-date', {
      defaultDate: today,
      dateFormat: 'Y-m-d',
      onChange: ([d]) => { _currentDate = d.toISOString().split('T')[0]; loadDiet(_currentDate); },
    });
    loadDiet(today);
  }

  function savePrefs() {
    clearTimeout(_savePrefsTimer);
    _savePrefsTimer = setTimeout(async () => {
      const payload = {
        food_preference: document.getElementById('pref-food').value,
        fitness_goal: document.getElementById('pref-goal').value,
      };
      await api.put('/api/customer/profile', payload);
      toast('Preferences saved!', 'success');
    }, 800);
  }

  async function loadDiet(date, bust = false) {
    if (bust) pageCache.bust(dietCacheKey(date));
    const cacheKey = dietCacheKey(date);
    const cached = pageCache.get(cacheKey);
    if (cached) { renderDietData(cached); showAge(date); return; }
    document.getElementById('meals-wrap').innerHTML = '<div class="spinner"></div>';
    const data = await api.get('/api/customer/diet?date=' + date);
    if (data?.success) pageCache.set(cacheKey, data);
    if (!data?.success) return;
    renderDietData(data);
    showAge(date);
  }

  function renderDietData(data) {
    if (data.plan) {
      document.getElementById('diet-plan-info').innerHTML = `
        <div class="flex-between">
          <div><strong class="text-white">${data.plan.name}</strong><br><span class="text-dim text-small">${data.plan.food_preference} · ${data.plan.fitness_goal || 'General'}</span></div>
          ${data.plan.calories_per_day ? `<span class="badge badge-orange">${data.plan.calories_per_day} kcal/day</span>` : ''}
        </div>
      `;
    }
    if (!data.meals?.length) {
      document.getElementById('meals-wrap').innerHTML = `
        <div class="text-center" style="padding:32px">
          <p class="text-dim">No meal plan for ${data.day || 'this day'}.</p>
          <p class="text-dim text-small mt-8">Your coach or admin will add a plan once your preferences are set.</p>
        </div>
      `;
      return;
    }
    const grouped = {};
    data.meals.forEach(m => { if (!grouped[m.meal_type]) grouped[m.meal_type] = []; grouped[m.meal_type].push(m); });
    document.getElementById('meals-wrap').innerHTML = Object.entries(grouped).map(([type, meals]) => `
      <div class="meal-card">
        <div class="meal-type">${type}</div>
        ${meals.map(m => `
          <div style="margin-bottom:8px">
            <strong class="text-white">${m.name}</strong>
            ${m.calories ? `<span class="badge badge-blue" style="margin-left:8px">${m.calories} kcal</span>` : ''}
            ${m.description ? `<p class="text-dim text-small mt-4">${m.description}</p>` : ''}
            ${m.recipe ? `<details class="mt-8"><summary class="text-orange text-small" style="cursor:pointer">View Recipe</summary><p class="text-dim text-small mt-8">${m.recipe}</p></details>` : ''}
          </div>
        `).join('')}
      </div>
    `).join('');
  }

  init();
</script>
<script src="/js/pwa.js" defer></script>
</body>
</html>
