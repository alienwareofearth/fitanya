<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#FF5C00">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fitanya">
  <link rel="apple-touch-icon" href="/icons/icon.svg">
  <title>My Badges — Fitanya</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    /* ── Hero ──────────────────────────────────────────────────────── */
    .badges-hero {
      text-align: center;
      padding: 36px 20px 24px;
    }
    .badges-hero h1 {
      font-family: var(--font-display);
      font-size: 3rem;
      color: var(--white);
      letter-spacing: 3px;
      margin-bottom: 6px;
    }
    .badges-hero p { color: var(--text-dim); font-size: 13px; }

    /* ── Stats ─────────────────────────────────────────────────────── */
    .stats-row {
      display: flex;
      gap: 14px;
      margin-bottom: 36px;
      justify-content: center;
    }
    .stat-pill {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 40px;
      padding: 12px 28px;
      text-align: center;
      min-width: 110px;
    }
    .stat-pill-num {
      font-family: var(--font-display);
      font-size: 2rem;
      color: var(--orange);
      line-height: 1;
    }
    .stat-pill-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-top: 3px;
    }

    /* ── Section header ────────────────────────────────────────────── */
    .section-label {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin: 0 0 20px;
    }

    /* ── Badge grid ────────────────────────────────────────────────── */
    .badge-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    @media (max-width: 480px) {
      .badge-grid { grid-template-columns: repeat(2, 1fr); gap: 16px; }
    }

    /* ── Badge cell ────────────────────────────────────────────────── */
    .badge-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      cursor: default;
    }

    /* SVG ring container */
    .badge-ring-wrap {
      position: relative;
      width: 130px;
      height: 130px;
      flex-shrink: 0;
    }
    .badge-ring-wrap svg {
      width: 130px;
      height: 130px;
      overflow: visible;
    }

    /* Glow halo for won badges */
    .badge-cell.won .badge-ring-wrap::before {
      content: '';
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,160,0,.22) 0%, transparent 70%);
      pointer-events: none;
      animation: badgePulse 3s ease-in-out infinite;
    }
    @keyframes badgePulse {
      0%, 100% { opacity: 0.7; transform: scale(1); }
      50%       { opacity: 1;   transform: scale(1.06); }
    }

    /* Missed / not-won: greyscale overlay via CSS filter */
    .badge-cell.missed .badge-ring-wrap {
      filter: grayscale(1) brightness(0.45);
    }
    .badge-cell.missed {
      opacity: 0.75;
    }

    /* Text below badge */
    .badge-name {
      font-family: var(--font-display);
      font-size: 1rem;
      letter-spacing: 1px;
      color: var(--white);
      text-align: center;
      line-height: 1.2;
    }
    .badge-cell.missed .badge-name { color: var(--text-dim); }

    .badge-sub {
      font-size: 10px;
      color: var(--text-dim);
      text-align: center;
      margin-top: -6px;
      letter-spacing: 0.3px;
    }
    .badge-cell.won .badge-sub { color: #c8a832; }

    /* Won tick */
    .badge-won-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(255,92,0,.15);
      border: 1px solid rgba(255,92,0,.4);
      border-radius: 20px;
      padding: 2px 10px;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--orange);
      margin-top: -4px;
    }
    .badge-cell.missed .badge-missed-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 20px;
      padding: 2px 10px;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--text-dim);
      margin-top: -4px;
    }

    /* Empty state */
    .empty-card {
      background: var(--card);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 48px 24px;
      text-align: center;
      color: var(--text-dim);
      font-size: 14px;
    }
    .empty-card .empty-icon { font-size: 40px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="app-layout">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <a href="/dashboard" class="sidebar-logo"><img src="/icons/logo.png" alt="Fitanya"><span class="sidebar-logo-text">FIT<span>ANYA</span></span></a>
      <div id="sidebar-profile"></div>
      <nav class="sidebar-nav">
        <a href="/dashboard" class="nav-item"><span class="icon">🏠</span>Dashboard</a>
        <a href="/dashboard/schedule" class="nav-item"><span class="icon">📅</span>Schedule</a>
        <a href="/dashboard/membership" class="nav-item"><span class="icon">🎫</span>Membership</a>
        <a href="/dashboard/payment" class="nav-item"><span class="icon">💳</span>Pay Now</a>
        <a href="/dashboard/progress" class="nav-item"><span class="icon">📊</span>Progress</a>
        <a href="/dashboard/diet" class="nav-item"><span class="icon">🥗</span>Diet & Nutrition</a>
        <a href="/dashboard/monthly-games" class="nav-item"><span class="icon">🏆</span>Monthly Games</a>
        <a href="/dashboard/badges" class="nav-item active"><span class="icon">🥇</span>My Badges</a>
        <a href="/dashboard/stories" class="nav-item"><span class="icon">📸</span>My Stories</a>
        <a href="/dashboard/referral" class="nav-item"><span class="icon">🎁</span>Refer & Earn</a>
        <a href="/dashboard/profile" class="nav-item"><span class="icon">👤</span>Profile</a>
      </nav>
      <div class="sidebar-footer">
        <button class="nav-item" onclick="logout()" style="width:100%"><span class="icon">🚪</span>Logout</button>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="main-content">
      <div class="badges-hero">
        <h1>MY BADGES</h1>
        <p>Your challenge achievements — every medal tells a story</p>
      </div>

      <!-- Stats -->
      <div class="stats-row">
        <div class="stat-pill">
          <div class="stat-pill-num" id="stat-wins">—</div>
          <div class="stat-pill-label">Won</div>
        </div>
        <div class="stat-pill">
          <div class="stat-pill-num" id="stat-badges">—</div>
          <div class="stat-pill-label">Badges Earned</div>
        </div>
      </div>

      <!-- Challenge Badges -->
      <div class="section-label">Monthly Challenges</div>
      <div class="badge-grid" id="badge-grid">
        <div class="spinner" style="grid-column:1/-1;justify-self:center;margin:40px 0"></div>
      </div>

    </main>
  </div>

  <div id="toast-container"></div>
  <script src="/js/app.js"></script>
  <script>
    /* ── Inline SVG badge builder (Apple Watch ring style) ──────────── */
    function buildBadgeSVG(won) {
      // Colour palettes
      const gold1 = '#FFD700', gold2 = '#FF8C00', gold3 = '#FF5C00';
      const dimC  = '#444444';

      // We always render the full-colour SVG; CSS filter handles the missed look.
      const id = 'g' + Math.random().toString(36).slice(2, 7);
      return `<svg viewBox="0 0 130 130" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Outer ring gradient -->
          <linearGradient id="${id}a" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%"   stop-color="${gold1}"/>
            <stop offset="50%"  stop-color="${gold2}"/>
            <stop offset="100%" stop-color="${gold3}"/>
          </linearGradient>
          <!-- Centre fill gradient -->
          <radialGradient id="${id}b" cx="50%" cy="35%" r="65%">
            <stop offset="0%"   stop-color="#2a1800"/>
            <stop offset="100%" stop-color="#0e0800"/>
          </radialGradient>
          <!-- Shimmer gradient -->
          <linearGradient id="${id}c" x1="0%" y1="0%" x2="60%" y2="100%">
            <stop offset="0%"   stop-color="rgba(255,255,255,0.18)"/>
            <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
          </linearGradient>
          <!-- Inner ring gradient -->
          <linearGradient id="${id}d" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%"   stop-color="${gold2}" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="${gold3}" stop-opacity="0.4"/>
          </linearGradient>
          <!-- Drop shadow filter -->
          <filter id="${id}f" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="${gold2}" flood-opacity="0.55"/>
          </filter>
        </defs>

        <!-- Outer ring (thick, main activity ring) -->
        <circle cx="65" cy="65" r="58" fill="none"
          stroke="url(#${id}a)" stroke-width="10"
          stroke-linecap="round"
          filter="url(#${id}f)"/>

        <!-- Ring end cap dot (top) -->
        <circle cx="65" cy="7" r="5" fill="${gold1}" filter="url(#${id}f)"/>

        <!-- Second inner decorative ring -->
        <circle cx="65" cy="65" r="46" fill="none"
          stroke="url(#${id}d)" stroke-width="2.5" stroke-dasharray="4 6"
          stroke-linecap="round" opacity="0.7"/>

        <!-- Centre disc -->
        <circle cx="65" cy="65" r="40" fill="url(#${id}b)"/>

        <!-- Shimmer highlight on centre -->
        <ellipse cx="55" cy="48" rx="24" ry="14" fill="url(#${id}c)" opacity="0.6"/>

        <!-- Trophy icon (text-based for universal render) -->
        <text x="65" y="62" text-anchor="middle" font-size="28" dominant-baseline="middle">🏆</text>

        <!-- Fitanya logo text at bottom of centre -->
        <text x="65" y="84" text-anchor="middle"
          font-family="'Bebas Neue',sans-serif" font-size="10" letter-spacing="2"
          fill="${gold1}" opacity="0.9">FITANYA</text>

        <!-- Outer ring tick mark at 12 o'clock -->
        <line x1="65" y1="1" x2="65" y2="13" stroke="${gold1}" stroke-width="2.5" stroke-linecap="round"/>
      </svg>`;
    }

    /* ── Render a single badge cell ────────────────────────────────── */
    function renderBadge({ name, endDate, won, participated }) {
      const stateClass = won ? 'won' : 'missed';
      const monthYear  = endDate
        ? new Date(endDate + 'T12:00:00').toLocaleDateString('en-IN', { month: 'short', year: 'numeric' })
        : '';
      const tag = won
        ? `<span class="badge-won-tag">✓ CHAMPION</span>`
        : `<span class="badge-missed-tag">${participated ? 'NOT WON' : 'MISSED'}</span>`;

      return `
        <div class="badge-cell ${stateClass}">
          <div class="badge-ring-wrap">${buildBadgeSVG(won)}</div>
          <div class="badge-name">${escapeHtml(name)}</div>
          <div class="badge-sub">${monthYear}</div>
          ${tag}
        </div>`;
    }

    function escapeHtml(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    /* ── Init ──────────────────────────────────────────────────────── */
    async function initBadges() {
      await requireAuth();
      const data = await api.get('/api/customer/badges');
      if (!data?.success) {
        document.getElementById('badge-grid').innerHTML =
          '<div class="empty-card" style="grid-column:1/-1"><div class="empty-icon">⚠️</div>Could not load badges.</div>';
        return;
      }

      const { wins, challenges } = data;
      const earnedCount = challenges.filter(c => c.won).length;

      document.getElementById('stat-wins').textContent   = wins;
      document.getElementById('stat-badges').textContent = earnedCount;

      const grid = document.getElementById('badge-grid');
      if (!challenges.length) {
        grid.innerHTML = `
          <div class="empty-card" style="grid-column:1/-1">
            <div class="empty-icon">🏅</div>
            No challenges have ended yet.<br>Join a Monthly Game to start earning badges!
          </div>`;
        return;
      }

      // Won first, then missed
      const sorted = [...challenges].sort((a, b) => b.won - a.won || b.end_date.localeCompare(a.end_date));
      grid.innerHTML = sorted.map(c => renderBadge(c)).join('');
    }

    initBadges();
  </script>
  <script src="/js/pwa.js" defer></script>
</body>
</html>
