<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#FF5C00">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fitanya">
  <link rel="apple-touch-icon" href="/icons/icon.svg">
  <title>Badges & Achievements — Fitanya</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    /* ── Hero ──────────────────────────────────────────────────────── */
    .badges-hero {
      text-align: center;
      padding: 36px 20px 24px;
    }
    .badges-hero h1 {
      font-family: var(--font-display);
      font-size: 3rem;
      color: var(--white);
      letter-spacing: 3px;
      margin-bottom: 6px;
    }
    .badges-hero p { color: var(--text-dim); font-size: 13px; }

    /* ── Stats ─────────────────────────────────────────────────────── */
    .stats-row {
      display: flex;
      gap: 14px;
      margin-bottom: 36px;
      justify-content: center;
    }
    .stat-pill {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 40px;
      padding: 12px 28px;
      text-align: center;
      min-width: 110px;
    }
    .stat-pill-num {
      font-family: var(--font-display);
      font-size: 2rem;
      color: var(--orange);
      line-height: 1;
    }
    .stat-pill-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-top: 3px;
    }

    /* ── Section header ────────────────────────────────────────────── */
    .section-label {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin: 0 0 20px;
    }

    /* ── Badge grid ────────────────────────────────────────────────── */
    .badge-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    @media (max-width: 480px) {
      .badge-grid { grid-template-columns: repeat(2, 1fr); gap: 16px; }
    }

    /* ── Badge cell — flip card wrapper ───────────────────────────── */
    .badge-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    /* 3-D flip container */
    .badge-flipper-wrap {
      width: 150px;
      height: 150px;
      perspective: 700px;
      flex-shrink: 0;
    }
    .badge-flipper {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.55s cubic-bezier(0.4, 0.2, 0.2, 1);
      border-radius: 50%;
    }
    .badge-flipper-wrap.flipped .badge-flipper {
      transform: rotateY(180deg);
    }

    /* Front face */
    .badge-front,
    .badge-back {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* SVG ring sits inside front */
    .badge-front svg {
      width: 150px;
      height: 150px;
      overflow: visible;
    }

    /* Back face */
    .badge-back {
      transform: rotateY(180deg);
      background: linear-gradient(145deg, #1c1000, #0e0800);
      border: 2px solid #b8860b;
      box-shadow: 0 0 18px rgba(255,160,0,.25);
      flex-direction: column;
      gap: 6px;
      padding: 16px 12px;
      text-align: center;
    }
    .badge-back-icon { font-size: 26px; line-height: 1; }
    .badge-back-title {
      font-family: var(--font-display);
      font-size: 0.85rem;
      letter-spacing: 1px;
      color: #FFD700;
      line-height: 1.2;
    }
    .badge-back-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-top: 4px;
    }
    .badge-back-dates {
      font-size: 11px;
      color: var(--white);
      font-weight: 600;
      line-height: 1.5;
    }
    .badge-back-tap {
      font-size: 9px;
      color: var(--text-dim);
      margin-top: 4px;
      letter-spacing: 0.5px;
    }

    /* Glow halo for won badges */
    .badge-cell.won .badge-flipper-wrap::before {
      content: '';
      position: absolute;
      inset: -14px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,160,0,.22) 0%, transparent 70%);
      pointer-events: none;
      animation: badgePulse 3s ease-in-out infinite;
    }
    .badge-flipper-wrap { position: relative; }
    @keyframes badgePulse {
      0%, 100% { opacity: 0.7; transform: scale(1); }
      50%       { opacity: 1;   transform: scale(1.06); }
    }

    /* Missed: greyscale */
    .badge-cell.missed .badge-front {
      filter: grayscale(1) brightness(0.45);
    }
    .badge-cell.missed { opacity: 0.75; }

    /* Text below badge */
    .badge-name {
      font-family: var(--font-display);
      font-size: 1rem;
      letter-spacing: 1px;
      color: var(--white);
      text-align: center;
      line-height: 1.2;
    }
    .badge-cell.missed .badge-name { color: var(--text-dim); }

    .badge-sub {
      font-size: 10px;
      color: var(--text-dim);
      text-align: center;
      margin-top: -6px;
    }
    .badge-cell.won .badge-sub { color: #c8a832; }

    /* Tags */
    .badge-won-tag {
      display: inline-flex; align-items: center; gap: 4px;
      background: rgba(255,92,0,.15); border: 1px solid rgba(255,92,0,.4);
      border-radius: 20px; padding: 2px 10px;
      font-size: 9px; font-weight: 800; letter-spacing: 1.5px;
      color: var(--orange); margin-top: -4px;
    }
    .badge-missed-tag {
      display: inline-flex; align-items: center; gap: 4px;
      background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.1);
      border-radius: 20px; padding: 2px 10px;
      font-size: 9px; font-weight: 800; letter-spacing: 1.5px;
      color: var(--text-dim); margin-top: -4px;
    }

    /* ── Light theme: restore white text inside the dark badge-back ── */
    body.light .badge-back {
      --white:    #FFFFFF;
      --text-dim: rgba(255,255,255,0.55);
    }
    body.light .badge-name    { color: #1A1A1A; }
    body.light .badge-sub     { color: #888; }
    body.light .badge-cell.missed .badge-name { color: #888; }
    body.light .badges-hero h1 { color: #1A1A1A; }
    body.light .badges-hero p  { color: #777; }
    body.light .section-label  { color: #888; }

    /* Empty state */
    .empty-card {
      background: var(--card);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 48px 24px;
      text-align: center;
      color: var(--text-dim);
      font-size: 14px;
    }
    .empty-card .empty-icon { font-size: 40px; margin-bottom: 12px; }
  </style>
</head>
<body class="light">
  <div class="app-layout">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <a href="/dashboard" class="sidebar-logo"><img src="/icons/logo.png" alt="Fitanya"><span class="sidebar-logo-text">FIT<span>ANYA</span></span></a>
      <div id="sidebar-profile"></div>
      <nav class="sidebar-nav">
        <a href="/dashboard/schedule" class="nav-item"><span class="icon">📅</span>Sessions</a>
      <a href="/dashboard/coach-notes" class="nav-item"><span class="icon">🗒️</span>Coach Notes</a>
        <a href="/dashboard/membership" class="nav-item"><span class="icon">🎫</span>Membership</a>
        <a href="/dashboard/diet" class="nav-item"><span class="icon">🥗</span>Meal Plan</a>
        <a href="/dashboard/monthly-games" class="nav-item"><span class="icon">🏆</span>Challenges</a>
        <a href="/dashboard/badges" class="nav-item active"><span class="icon">🥇</span>Badges & Achievements</a>
        <a href="/dashboard/progress" class="nav-item"><span class="icon">📊</span>Progress</a>
        <a href="/dashboard/stories" class="nav-item"><span class="icon">⭐</span>Reviews</a>
        <a href="/dashboard/payment" class="nav-item"><span class="icon">💳</span>Pay Now</a>
        <a href="/dashboard/referral" class="nav-item"><span class="icon">🎁</span>Refer & Earn</a>
      </nav>
      <div class="sidebar-footer">
        <button class="nav-item" onclick="logout()" style="width:100%"><span class="icon">🚪</span>Logout</button>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="main-content">
      <div class="badges-hero">
        <h1>MY BADGES</h1>
        <p>Your challenge achievements — every medal tells a story</p>
      </div>

      <!-- Stats -->
      <div class="stats-row">
        <div class="stat-pill">
          <div class="stat-pill-num" id="stat-wins">—</div>
          <div class="stat-pill-label">Won</div>
        </div>
        <div class="stat-pill">
          <div class="stat-pill-num" id="stat-badges">—</div>
          <div class="stat-pill-label">Badges Earned</div>
        </div>
      </div>

      <!-- Challenge Badges -->
      <div class="section-label">Monthly Challenges</div>
      <div class="badge-grid" id="badge-grid">
        <div class="spinner" style="grid-column:1/-1;justify-self:center;margin:40px 0"></div>
      </div>

    </main>
  </div>

  <div id="toast-container"></div>
  <script src="/js/app.js"></script>
  <script>
    function escapeHtml(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function fmtDate(d) {
      return d ? new Date(d + 'T12:00:00').toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' }) : '—';
    }

    /* ── Inline SVG badge front (Apple Watch ring style) ────────────── */
    function buildBadgeSVG() {
      const gold1 = '#FFD700', gold2 = '#FF8C00', gold3 = '#FF5C00';
      const id = 'g' + Math.random().toString(36).slice(2, 7);
      return `<svg viewBox="0 0 130 130" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="${id}a" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%"   stop-color="${gold1}"/>
            <stop offset="50%"  stop-color="${gold2}"/>
            <stop offset="100%" stop-color="${gold3}"/>
          </linearGradient>
          <radialGradient id="${id}b" cx="50%" cy="35%" r="65%">
            <stop offset="0%"   stop-color="#2a1800"/>
            <stop offset="100%" stop-color="#0e0800"/>
          </radialGradient>
          <linearGradient id="${id}c" x1="0%" y1="0%" x2="60%" y2="100%">
            <stop offset="0%"   stop-color="rgba(255,255,255,0.18)"/>
            <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
          </linearGradient>
          <linearGradient id="${id}d" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%"   stop-color="${gold2}" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="${gold3}" stop-opacity="0.4"/>
          </linearGradient>
          <filter id="${id}f" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="${gold2}" flood-opacity="0.55"/>
          </filter>
        </defs>
        <circle cx="65" cy="65" r="58" fill="none" stroke="url(#${id}a)" stroke-width="10" stroke-linecap="round" filter="url(#${id}f)"/>
        <circle cx="65" cy="7"  r="5"  fill="${gold1}" filter="url(#${id}f)"/>
        <circle cx="65" cy="65" r="46" fill="none" stroke="url(#${id}d)" stroke-width="2.5" stroke-dasharray="4 6" stroke-linecap="round" opacity="0.7"/>
        <circle cx="65" cy="65" r="40" fill="url(#${id}b)"/>
        <ellipse cx="55" cy="48" rx="24" ry="14" fill="url(#${id}c)" opacity="0.6"/>
        <text x="65" y="62" text-anchor="middle" font-size="28" dominant-baseline="middle">🏆</text>
        <text x="65" y="84" text-anchor="middle" font-family="'Bebas Neue',sans-serif" font-size="10" letter-spacing="2" fill="${gold1}" opacity="0.9">FITANYA</text>
        <line x1="65" y1="1" x2="65" y2="13" stroke="${gold1}" stroke-width="2.5" stroke-linecap="round"/>
      </svg>`;
    }

    /* ── Render a single badge cell with flip card ───────────────────── */
    function renderBadge({ name, startDate, endDate, won, participated }) {
      const stateClass = won ? 'won' : 'missed';
      const tag = won
        ? `<span class="badge-won-tag">✓ CHAMPION</span>`
        : `<span class="badge-missed-tag">${participated ? 'NOT WON' : 'MISSED'}</span>`;

      const backContent = won
        ? `<div class="badge-back-icon">🏆</div>
           <div class="badge-back-title">${escapeHtml(name)}</div>
           <div class="badge-back-label">Challenge Period</div>
           <div class="badge-back-dates">${fmtDate(startDate)}<br>— ${fmtDate(endDate)}</div>
           <div class="badge-back-tap">Tap to flip back</div>`
        : `<div class="badge-back-icon">${participated ? '😔' : '📅'}</div>
           <div class="badge-back-title">${escapeHtml(name)}</div>
           <div class="badge-back-label">Challenge Period</div>
           <div class="badge-back-dates">${fmtDate(startDate)}<br>— ${fmtDate(endDate)}</div>
           <div class="badge-back-tap">Tap to flip back</div>`;

      return `
        <div class="badge-cell ${stateClass}" onclick="toggleFlip(this)">
          <div class="badge-flipper-wrap">
            <div class="badge-flipper">
              <div class="badge-front">${buildBadgeSVG()}</div>
              <div class="badge-back">${backContent}</div>
            </div>
          </div>
          <div class="badge-name">${escapeHtml(name)}</div>
          <div class="badge-sub">${fmtDate(endDate)}</div>
          ${tag}
        </div>`;
    }

    function toggleFlip(cell) {
      cell.querySelector('.badge-flipper-wrap').classList.toggle('flipped');
    }

    /* ── Init ──────────────────────────────────────────────────────── */
    async function initBadges() {
      await requireAuth();
      const data = await api.get('/api/customer/badges');
      if (!data?.success) {
        document.getElementById('badge-grid').innerHTML =
          '<div class="empty-card" style="grid-column:1/-1"><div class="empty-icon">⚠️</div>Could not load badges.</div>';
        return;
      }

      const { wins, challenges } = data;
      const earnedCount = challenges.filter(c => c.won).length;

      document.getElementById('stat-wins').textContent   = wins;
      document.getElementById('stat-badges').textContent = earnedCount;

      const grid = document.getElementById('badge-grid');
      if (!challenges.length) {
        grid.innerHTML = `
          <div class="empty-card" style="grid-column:1/-1">
            <div class="empty-icon">🏅</div>
            No challenges have ended yet.<br>Join a Monthly Game to start earning badges!
          </div>`;
        return;
      }

      // Won first, then missed
      const sorted = [...challenges].sort((a, b) => b.won - a.won || b.end_date.localeCompare(a.end_date));
      grid.innerHTML = sorted.map(c => renderBadge({
        name: c.name,
        startDate: c.start_date,
        endDate: c.end_date,
        won: c.won,
        participated: c.participated,
      })).join('');
    }

    initBadges();
  </script>
  <script src="/js/pwa.js" defer></script>
</body>
</html>
