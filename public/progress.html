<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#FF5C00">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fitanya">
  <link rel="apple-touch-icon" href="/icons/icon.svg">
  <title>Progress — Fitanya</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .log-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 24px;
    }
    .log-card-title {
      font-family: var(--font-display);
      font-size: 1.4rem;
      letter-spacing: 1px;
      color: var(--white);
      margin-bottom: 20px;
    }
    .history-row {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 16px 18px;
      margin-bottom: 10px;
    }
    .history-row-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .history-date {
      font-size: 12px;
      font-weight: 700;
      color: var(--orange);
      letter-spacing: 0.5px;
    }
    .history-week {
      font-size: 11px;
      color: var(--text-dim);
    }
    .history-metrics {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 10px;
    }
    .history-metric { text-align: center; }
    .history-metric-val {
      font-family: var(--font-display);
      font-size: 1.3rem;
      color: var(--white);
      line-height: 1;
    }
    .history-metric-val.orange { color: var(--orange); }
    .history-metric-label {
      font-size: 10px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 3px;
    }
    .history-notes {
      margin-top: 10px;
      font-size: 12px;
      color: var(--text-dim);
      font-style: italic;
      border-top: 1px solid var(--border);
      padding-top: 8px;
    }
    .prog-section { border: 1px solid var(--border); border-radius: 14px; margin-bottom: 10px; overflow: hidden; }
    .prog-section-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 15px 18px; cursor: pointer; background: var(--card);
      transition: background 0.15s; user-select: none; gap: 12px;
    }
    .prog-section-header:hover { background: rgba(255,92,0,0.06); }
    .prog-section-header.open { border-bottom: 1px solid var(--border); }
    .prog-section-title { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .prog-section-icon { font-size: 1.3rem; flex-shrink: 0; }
    .prog-section-name { font-weight: 600; font-size: 15px; color: var(--white); }
    .prog-section-sub { font-size: 12px; color: var(--text-dim); margin-top: 1px; }
    .prog-section-chev { color: var(--text-dim); font-size: 13px; transition: transform 0.2s; flex-shrink: 0; }
    .prog-section-chev.open { transform: rotate(90deg); }
    .prog-section-body { display: none; }
    .prog-section-body.open { display: block; }
    .prog-section-inner { padding: 20px; }
  </style>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <a href="/dashboard" class="sidebar-logo"><img src="/icons/logo.png" alt="Fitanya"><span class="sidebar-logo-text">FIT<span>ANYA</span></span></a>
    <div id="sidebar-profile"></div>
    <nav class="sidebar-nav">
      <a href="/dashboard" class="nav-item"><span class="icon">🏠</span>Dashboard</a>
      <a href="/dashboard/schedule" class="nav-item"><span class="icon">📅</span>Schedule</a>
      <a href="/dashboard/membership" class="nav-item"><span class="icon">🎫</span>Membership</a>
      <a href="/dashboard/payment" class="nav-item"><span class="icon">💳</span>Pay Now</a>
      <a href="/dashboard/progress" class="nav-item active"><span class="icon">📊</span>Progress</a>
      <a href="/dashboard/diet" class="nav-item"><span class="icon">🥗</span>Diet & Nutrition</a>
      <a href="/dashboard/monthly-games" class="nav-item"><span class="icon">🏆</span>Monthly Games</a>
      <a href="/dashboard/badges" class="nav-item"><span class="icon">🥇</span>My Badges</a>
      <a href="/dashboard/stories" class="nav-item"><span class="icon">📸</span>My Stories</a>
      <a href="/dashboard/referral" class="nav-item"><span class="icon">🎁</span>Refer & Earn</a>
      <a href="/dashboard/profile" class="nav-item"><span class="icon">👤</span>Profile</a>
    </nav>
    <div class="sidebar-footer"><button class="nav-item" onclick="logout()"><span class="icon">🚪</span>Logout</button></div>
  </aside>
  <main class="main-content">
    <div class="page-header flex-between mb-24">
      <div>
        <h2>My Progress</h2>
        <p class="text-dim">Track your body measurements over time</p>
      </div>
    </div>

    <!-- Log Your Measurements -->
    <div class="log-card">
      <div class="log-card-title">Log Your Measurements</div>
      <div class="grid-2 gap-16">
        <div class="form-group"><label>Weight (kg)</label><input class="form-control" type="number" id="log-weight" placeholder="e.g. 72.5" step="0.1"></div>
        <div class="form-group"><label>Waist (inches)</label><input class="form-control" type="number" id="log-waist" placeholder="e.g. 32" step="0.5"></div>
        <div class="form-group"><label>Thigh (inches)</label><input class="form-control" type="number" id="log-thigh" placeholder="e.g. 22" step="0.5"></div>
        <div class="form-group"><label>Arm (inches)</label><input class="form-control" type="number" id="log-arm" placeholder="e.g. 12" step="0.5"></div>
        <div class="form-group"><label>Chest (inches)</label><input class="form-control" type="number" id="log-chest" placeholder="e.g. 36" step="0.5"></div>
      </div>
      <div class="form-group"><label>Notes</label><textarea class="form-control" id="log-notes" rows="2" placeholder="How are you feeling?"></textarea></div>
      <button class="btn btn-primary" onclick="saveProgress()">Save Measurements 💪</button>
    </div>

    <!-- Measurement History -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <div class="section-title" style="margin:0">Measurement History</div>
      <span id="history-count" class="text-dim text-small"></span>
    </div>
    <div id="history-list"><div class="spinner"></div></div>

    <!-- Coach Notes -->
    <div class="prog-section" style="margin-top:24px">
      <div class="prog-section-header" id="hdr-notes" onclick="toggleNotes()">
        <div class="prog-section-title">
          <span class="prog-section-icon">🗒️</span>
          <div>
            <div class="prog-section-name">Coach Notes</div>
            <div class="prog-section-sub" id="sub-notes">Session feedback &amp; next-session plans</div>
          </div>
        </div>
        <span class="prog-section-chev" id="chev-notes">▶</span>
      </div>
      <div class="prog-section-body" id="body-notes">
        <div class="prog-section-inner" id="inner-notes"></div>
      </div>
    </div>

  </main>
</div>
<div id="toast-container"></div>
<script src="/js/app.js"></script>
<script>
  let _notesLoaded = false;

  async function init() {
    await requireAuth();
    loadHistory();
  }

  async function loadHistory() {
    const el = document.getElementById('history-list');
    const data = await api.get('/api/customer/progress');
    const logs = data?.logs || [];

    document.getElementById('history-count').textContent = logs.length ? `${logs.length} entr${logs.length === 1 ? 'y' : 'ies'}` : '';

    if (!logs.length) {
      el.innerHTML = `<div class="card text-center" style="padding:40px;color:var(--text-dim)">
        No measurements logged yet.<br>Use the form above to log your first entry.
      </div>`;
      return;
    }

    // logs come latest-first from API (ORDER BY year DESC, week_number DESC)
    el.innerHTML = logs.map(l => {
      const metrics = [
        { val: l.weight,  label: 'kg',     cls: 'orange' },
        { val: l.waist,   label: 'Waist"', cls: '' },
        { val: l.thigh,   label: 'Thigh"', cls: '' },
        { val: l.arm,     label: 'Arm"',   cls: '' },
        { val: l.chest,   label: 'Chest"', cls: '' },
      ].filter(m => m.val);

      return `
        <div class="history-row">
          <div class="history-row-header">
            <span class="history-date">${formatDate(l.log_date)}</span>
            <span class="history-week">Week ${l.week_number}, ${l.year}</span>
          </div>
          <div class="history-metrics">
            ${metrics.map(m => `
              <div class="history-metric">
                <div class="history-metric-val ${m.cls}">${m.val}</div>
                <div class="history-metric-label">${m.label}</div>
              </div>`).join('')}
            ${!metrics.length ? '<span class="text-dim text-small">No measurements recorded</span>' : ''}
          </div>
          ${l.notes ? `<div class="history-notes">"${l.notes}"</div>` : ''}
        </div>`;
    }).join('');
  }

  async function toggleNotes() {
    const body = document.getElementById('body-notes');
    const hdr  = document.getElementById('hdr-notes');
    const chev = document.getElementById('chev-notes');
    const opening = !body.classList.contains('open');
    body.classList.toggle('open', opening);
    hdr.classList.toggle('open', opening);
    chev.classList.toggle('open', opening);
    if (opening && !_notesLoaded) {
      _notesLoaded = true;
      document.getElementById('inner-notes').innerHTML = '<div class="spinner"></div>';
      const data  = await api.get('/api/bookings/my');
      const notes = data?.bookings?.filter(b => b.session_notes) || [];
      const sub   = document.getElementById('sub-notes');
      if (!notes.length) {
        sub.textContent = 'Session feedback & next-session plans';
        document.getElementById('inner-notes').innerHTML = '<p class="text-dim">No coach notes yet. Notes appear here after each completed session.</p>';
        return;
      }
      sub.textContent = `${notes.length} session${notes.length !== 1 ? 's' : ''} with notes`;
      document.getElementById('inner-notes').innerHTML = notes.map(b => `
        <div style="border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:10px">
          <div class="flex-between mb-12">
            <div>
              <div style="font-weight:600;color:var(--white)">${formatSessionDate(b.date, b.start_time)} · ${formatSessionTime(b.start_time, b.date)}</div>
              <div class="text-dim text-small">Coach: ${b.coach_name}</div>
            </div>
            <span class="badge badge-green">Completed</span>
          </div>
          <p style="color:var(--text);font-size:14px;margin-bottom:8px"><strong class="text-orange">Notes:</strong><br>${b.session_notes}</p>
          ${b.workout_done     ? `<p style="font-size:13px;color:var(--text);margin-bottom:6px"><strong class="text-dim">Workout done:</strong> ${b.workout_done}</p>` : ''}
          ${b.next_session_plan ? `<p style="font-size:13px;color:var(--text)"><strong class="text-dim">Next session plan:</strong> ${b.next_session_plan}</p>` : ''}
        </div>`).join('');
    }
  }

  async function saveProgress() {
    const btn = document.querySelector('[onclick="saveProgress()"]');
    if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
    try {
      const payload = {
        weight: document.getElementById('log-weight').value,
        waist:  document.getElementById('log-waist').value,
        thigh:  document.getElementById('log-thigh').value,
        arm:    document.getElementById('log-arm').value,
        chest:  document.getElementById('log-chest').value,
        notes:  document.getElementById('log-notes').value,
      };
      const data = await api.post('/api/customer/progress', payload);
      if (data?.success) {
        toast('Measurements saved! 💪', 'success');
        ['log-weight','log-waist','log-thigh','log-arm','log-chest','log-notes'].forEach(id => {
          const el = document.getElementById(id);
          if (el) el.value = '';
        });
        loadHistory();
      } else {
        toast(data?.error || 'Failed to save — please try again', 'error');
      }
    } catch (e) {
      toast('Network error — please try again', 'error');
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = 'Save Measurements 💪'; }
    }
  }

  init();
</script>
<script src="/js/pwa.js" defer></script>
</body>
</html>
